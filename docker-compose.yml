version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ruralconnect_db
    environment:
      POSTGRES_USER: ruralconnect
      POSTGRES_PASSWORD: ruralconnect_dev
      POSTGRES_DB: ruralconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruralconnect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ruralconnect-network

  # Redis Cache (for sessions, real-time, caching)
  redis:
    image: redis:7-alpine
    container_name: ruralconnect_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ruralconnect-network

  # API Service
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ruralconnect_api
    environment:
      DATABASE_URL: postgresql://ruralconnect:ruralconnect_dev@postgres:5432/ruralconnect
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      API_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    networks:
      - ruralconnect-network
    command: npm run dev

  # Web Service
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: ruralconnect_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    networks:
      - ruralconnect-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  ruralconnect-network:
    driver: bridge
