version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ruralconnect_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ruralconnect
      POSTGRES_PASSWORD: ruralconnect_dev
      POSTGRES_DB: ruralconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruralconnect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ruralconnect-network

  # Redis Cache & Real-Time Stream
  redis:
    image: redis:7-alpine
    container_name: ruralconnect_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ruralconnect-network

  # Backend NestJS API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ruralconnect_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ruralconnect:ruralconnect_dev@postgres:5432/ruralconnect
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ruralconnect-network

  # Next.js 14 Frontend Web Application
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ruralconnect_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - ruralconnect-network

volumes:
  postgres_data:
  redis_data:

networks:
  ruralconnect-network:
    driver: bridge
